# Workspace root.
#
# Members are added phase by phase as each crate is implemented for real: the
# blueprint's target tree (docs/architecture/rust-engine-blueprint.md, section 3.2)
# lists the destination, not a promise that every crate exists today. A crate is
# only added here once it holds working code, so that `cargo test` never runs
# against a stub.
[workspace]
resolver = "2"
members = [
    "crates/qh-columnar",
    "crates/qh-core",
    "crates/qh-credentials",
    "crates/qh-driver",
    "crates/qh-driver-mysql",
    "crates/qh-driver-postgres",
    "crates/qh-driver-trino",
    "crates/qh-editor",
    "crates/qh-export",
    "crates/qh-ffi",
    "crates/qh-import",
    "crates/qh-rt",
    "crates/qh-result-store",
    "crates/qh-sql",
    "crates/qh-sql-grammar",
    "crates/qh-storage",
    "crates/qh-sync",
    "crates/qh-tunnel",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Faisal Nugraha Cayunda"]
repository = "https://github.com/data-ecosystem/queryhive"

[workspace.dependencies]
qh-columnar = { path = "crates/qh-columnar" }
qh-core = { path = "crates/qh-core" }
qh-driver = { path = "crates/qh-driver" }
qh-driver-mysql = { path = "crates/qh-driver-mysql" }
qh-driver-postgres = { path = "crates/qh-driver-postgres" }
qh-driver-trino = { path = "crates/qh-driver-trino" }
qh-editor = { path = "crates/qh-editor" }
qh-credentials = { path = "crates/qh-credentials" }
qh-export = { path = "crates/qh-export" }
qh-ffi = { path = "crates/qh-ffi" }
qh-import = { path = "crates/qh-import" }
qh-rt = { path = "crates/qh-rt" }
qh-result-store = { path = "crates/qh-result-store" }
qh-sql = { path = "crates/qh-sql" }
qh-sql-grammar = { path = "crates/qh-sql-grammar" }
qh-storage = { path = "crates/qh-storage" }
qh-sync = { path = "crates/qh-sync" }
qh-tunnel = { path = "crates/qh-tunnel" }
thiserror = "2"
serde_json = { version = "1", features = ["preserve_order"] }
# The Fase 6 data plane (blueprint fase-6-data-plane.md D-1): the result store
# holds one Arrow RecordBatch per chunk. Pinned to 59.3, the same version as the
# `parquet` writer already in Cargo.lock (F-1), so the graph keeps one Arrow.
arrow-array = "59.3"
arrow-schema = "59.3"
arrow-buffer = "59.3"
arrow-data = "59.3"
arrow-ipc = "59.3"
# View work (sort, filter, search) runs here, off the main thread.
rayon = "1"
# Grid text metrics (grapheme counts) and case folding.
unicode-segmentation = "1"
unicode-normalization = "0.1"
unicode-properties = "0.1"
# AES-256-GCM for spill (NFR-S3) and zeroizing the key buffer seed.
ring = "0.17"
# The Keychain, and the values that hold a password. `security-framework-sys` is the
# raw attribute list and `SecItem*` calls; `core-foundation` builds the dictionary
# they take. See crates/qh-credentials for why the item is spelled out by hand.
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"
secrecy = "0.10"
zeroize = "1"
# SQLite, compiled in: the local database is small metadata, and `bundled` removes any
# dependence on the SQLite the machine happens to have (ADR-0005's sibling decision in
# §5 of the blueprint). Used from a blocking thread, never from a tokio worker.
rusqlite = { version = "0.37", features = ["bundled"] }
# UUIDv7 for row identity: time-ordered, so an index on the primary key stays close to
# insertion order instead of scattering like a random UUID.
uuid = { version = "1", features = ["v7"] }
# The editor's parser: tree-sitter with the SQL grammar vendored in `crates/qh-sql-grammar`
# (docs/architecture/blueprints/fase-4b-editor-analysis.md §3). Pinned with `=` because the
# workspace's `rust-version` is 1.85 and tree-sitter 0.27 / tree-sitter-language 0.1.8 need
# 1.90; a resolver that ignores the MSRV would pick them on the next `cargo update`.
tree-sitter = "=0.26.13"
tree-sitter-language = "=0.1.7"
# Already in the graph through `ring` and `libsqlite3-sys`; named here so the grammar's
# `build.rs` and the tree-sitter runtime share the one version.
cc = "1.4"

# Release profile for the FFI artifact.
#
# `panic = "unwind"`, deliberately: the FFI boundary catches panics and turns them
# into an errored call rather than letting them cross into Swift, and that needs
# unwinding tables. See docs/decisions/0009-panic-unwind-across-ffi.md.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"

# The C parser and the tree-sitter runtime are compiled by `cc`, which reads OPT_LEVEL per
# package. Without this they are built -O0 in a debug build, and every debug-mode test that
# parses runs against a parser several times slower than the one that ships.
[profile.dev.package.qh-sql-grammar]
opt-level = 2

[profile.dev.package.tree-sitter]
opt-level = 2
