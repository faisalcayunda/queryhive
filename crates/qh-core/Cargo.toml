[package]
name = "qh-core"
version = "0.1.0"
description = "Canonical value types, error taxonomy and capabilities shared by every QueryHive driver"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# `to_json_value` returns a real JSON value rather than a hand-rolled enum: the thing
# it feeds is a JSON writer, and a second representation would only be one more thing
# to keep in step.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror.workspace = true

[lints.rust]
unsafe_code = "forbid"
