[package]
name = "qh-ffi"
version = "0.1.0"
description = "The engine entry point: the eleven commands, and the CLI the golden harness runs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The debug binary the golden harness runs. The name matches the Python script it
# replaces (`app/engine/queryhive_engine.py`), because the app and the harness both
# address the engine by it.
[[bin]]
name = "queryhive-engine"
path = "src/main.rs"

[dependencies]
qh-core.workspace = true
qh-driver.workspace = true
qh-driver-mysql.workspace = true
qh-driver-postgres.workspace = true
qh-driver-trino.workspace = true
qh-export.workspace = true
qh-rt.workspace = true
qh-sql.workspace = true

# Key order in an event does not matter to a decoder, but a stable one makes the
# engine's stdout diffable against the frozen snapshots byte for byte. This build
# has no `preserve_order` on purpose: the map is a BTreeMap, so keys come out
# sorted, which is exactly how `tools/golden/record.py` normalises them.
serde_json = "1"
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "signal"] }
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "signal"] }

[lints.rust]
unsafe_code = "forbid"
