[package]
name = "qh-ffi"
version = "0.1.0"
description = "The engine entry point: the fourteen commands, and the CLI the golden harness runs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# A `cdylib` as well as a `lib`: the binding generator reads the compiled library
# (`--library`) rather than the source, which is the only way it can see the types the
# proc macros produced.
[lib]
name = "qh_ffi"
crate-type = ["lib", "cdylib"]

# The bindings are generated by the workspace's pinned `uniffi`, never by a
# `cargo install`ed one, so the generator and the runtime cannot drift apart.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

# The debug binary the golden harness runs. The name matches the Python script it
# replaces (`app/engine/queryhive_engine.py`), because the app and the harness both
# address the engine by it.
[[bin]]
name = "queryhive-engine"
path = "src/main.rs"

[dependencies]
qh-core.workspace = true
# The local store and the password store, for the three commands that do not open a
# driver: `connections`, `import_connections` and `credential`.
qh-credentials.workspace = true
qh-driver.workspace = true
qh-driver-mysql.workspace = true
qh-driver-postgres.workspace = true
qh-driver-trino.workspace = true
qh-export.workspace = true
qh-rt.workspace = true
qh-sql.workspace = true
qh-storage.workspace = true
qh-sync.workspace = true
# The SSH bastion a connection can be reached through: opened in `connect`, never a
# command of its own (blueprint §3.2 — the tunnel is part of connecting).
qh-tunnel.workspace = true

# A secret is carried in a `SecretString`, never in a `String` that outlives the call
# that produced it.
secrecy.workspace = true

# Key order in an event does not matter to a decoder, but a stable one makes the
# engine's stdout diffable against the frozen snapshots byte for byte. This build
# has no `preserve_order` on purpose: the map is a BTreeMap, so keys come out
# sorted, which is exactly how `tools/golden/record.py` normalises them.
serde_json = "1"
# The control plane only (ADR-0004): errors and typed values, not the grid data plane,
# which is a handle and an offset buffer precisely because marshalling every cell as a
# string is the problem this migration exists to remove.
uniffi = { version = "0.32", features = ["cli"] }
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "signal", "sync", "time"] }
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "signal", "time"] }
# The local commands are pointed at a throwaway database and a throwaway
# `connections.json` through `DB_PATH` / `LEGACY_PATH`, so a test never reads or writes
# the files the app owns.
tempfile = "3"
# One test vector: the base64 body of a real `.pub` key, for the host-key messages.
base64 = "0.22"

[lints.rust]
unsafe_code = "forbid"
