[package]
name = "qh-import"
version = "0.1.0"
description = "Streaming CSV, XLSX and JSON readers, and the values they hand an INSERT"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
qh-core.workspace = true
# Only for the identifier quote character and the escaping a MySQL string
# literal needs; the crate's own dialect rules stay in one place.
qh-sql.workspace = true
# Only for the code-page tables the export writers already carry, read backwards.
qh-export.workspace = true
# The CSV reader: RFC 4180 quoting, configurable delimiter, and one record at a
# time, so a large file is not held. `default-features = false` drops the serde
# integration this crate does not use.
csv = { version = "1", default-features = false }
# XLSX rows stream through `worksheet_cells_reader`, but the format interleaves a sheet
# with a shared-string table, so that table is held and the size guards bound it.
calamine = { version = "0.30", default-features = false, features = ["dates", "chrono"] }
# The JSON reader: raw values, so a number is not squeezed through f64.
serde = "1"
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true

[lints.rust]
unsafe_code = "forbid"
