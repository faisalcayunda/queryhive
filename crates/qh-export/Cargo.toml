[package]
name = "qh-export"
version = "0.1.0"
description = "Streaming export writers: text, csv, json, xml, html, sql, xls, xlsx, dbf, parquet"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
qh-core.workspace = true
# The JSON writer's own formatting, so that the array form and the render path share
# one implementation of Python's layout rather than two that drift.
serde_json = { version = "1", features = ["preserve_order"] }
# Deflate, for `bundle`'s archive: a multi-part export is downloaded as one zip, and
# storing it uncompressed would make a 200 MB CSV a 200 MB download. The Rust backend
# and not the C one, for the same reason the TLS stack is rustls — nothing to link,
# nothing extra to sign. The archive's bytes are not compared with Python's `zipfile`
# (two correct deflate implementations may choose different back-references); its
# contents are.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The tenth format: Parquet, written by the native Rust encoder rather than
# DuckDB (ADR-0018). No default features, because this writer writes
# uncompressed column chunks and the codec features would pull a codec crate in
# for a setting nothing here can choose. `arrow` is deliberately not enabled:
# the writer takes the low-level column API, so an arrow array is never built and
# the result set is never held in memory as a columnar table.
parquet = { version = "59", default-features = false }
thiserror.workspace = true

[lints.rust]
unsafe_code = "forbid"
