[package]
name = "qh-driver-mysql"
version = "0.1.0"
description = "MySQL driver: streaming batches over a bounded channel, exact decimals, KILL QUERY cancel"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1"
# default-features = false drops the TLS backends, so the TLS ones this driver now
# uses are named explicitly: `rustls-tls` is the backend (rustls + tokio-rustls +
# the `webpki-roots` bundle), `tls12` keeps TLS 1.2 servers reachable, and `ring`
# picks the crypto provider — the alternative, `aws-lc-rs`, drags in a C build.
# `minimal-rust` is the compression backend, unchanged: pure Rust, so the crate
# still has no C dependency to arrange.
#
# Which roots `rustls` verifies against, and why the platform store cannot be
# plugged in, is in `src/tls.rs`.
mysql_async = { version = "0.36", default-features = false, features = [
    "minimal-rust",
    "rustls-tls",
    "tls12",
    "ring",
] }
qh-core.workspace = true
qh-driver.workspace = true
qh-sql.workspace = true
# The same `rustls` `mysql_async` builds against, and no more of it than that: the
# crate is named here so a certificate rejection can be recognised as one
# (`rustls::Error::InvalidCertificate`) instead of being reported as a generic
# handshake failure. `default-features = false` matches `mysql_async`'s own
# requirement, which is what keeps `aws-lc-rs` out of the build.
rustls = { version = "0.23", default-features = false, features = ["std"] }
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "io-util", "rt-multi-thread", "time"] }

[lints.rust]
unsafe_code = "forbid"
