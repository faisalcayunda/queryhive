# Dev databases for the integration tests and the benchmark baseline.
#
#   podman compose -f deploy/dev/compose.yaml up -d
#   # or, if no compose provider is installed (this machine's case):
#   deploy/dev/up.sh all
#
# `up.sh` is the supported path here: it uses plain `podman run` commands and
# loads the fixtures afterwards, so it needs nothing beyond podman itself. This
# file exists so the same environment is reproducible for contributors who do
# have a compose provider.
#
# Ports are off the defaults (55432, 53306, 58080) so a database already
# listening locally is neither shadowed nor accidentally used.
#
# The credentials below are throwaway fixtures for generated data in a local
# container. They are not secrets and grant access to nothing else; a real
# connection's password never reaches this file or any other in the repository.
name: queryhive-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: qh-postgres
    environment:
      POSTGRES_USER: qh
      POSTGRES_PASSWORD: qh-dev-only
      POSTGRES_DB: qh
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - qh-postgres-data:/var/lib/postgresql/data
      # Loaded once, on an empty data directory, by the image's own entrypoint.
      - ./seed-postgres.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qh -d qh"]
      interval: 2s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8.4
    container_name: qh-mysql
    environment:
      MYSQL_ROOT_PASSWORD: qh-dev-root-only
      MYSQL_DATABASE: qh
      MYSQL_USER: qh
      MYSQL_PASSWORD: qh-dev-only
    ports:
      - "127.0.0.1:53306:3306"
    volumes:
      - qh-mysql-data:/var/lib/mysql
      - ./seed-mysql.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pqh-dev-root-only"]
      interval: 2s
      timeout: 5s
      retries: 45

  # Trino is not started by up.sh by default: a single-node coordinator wants
  # roughly 2 GiB of its own. Give the podman VM enough memory first (6 GiB here;
  # `podman machine stop && podman machine set --memory 6144 && podman machine
  # start`); the container is capped at 3 GiB, as in up.sh.
  #
  # The tag is deliberately unpinned: the version to support has to come from the
  # upstream release list, and pinning a number nobody has verified would be
  # worse than leaving it visible. See docs/compatibility.md.
  trino:
    image: trinodb/trino:latest
    container_name: qh-trino
    mem_limit: 3g
    ports:
      - "127.0.0.1:58080:8080"
    profiles: ["trino"]

  # PostgreSQL behind 15 ms of latency each way (30 ms RTT) on 55435, for the
  # RTT benchmarks. Compose cannot call toxiproxy's HTTP API, so the proxy and
  # its toxics are created by the one-shot `toxiproxy-setup` service below.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    container_name: qh-toxiproxy
    ports:
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:55435:55435"
    depends_on:
      - postgres
    profiles: ["toxiproxy"]

  toxiproxy-setup:
    image: docker.io/curlimages/curl:8.10.1
    depends_on:
      - toxiproxy
    profiles: ["toxiproxy"]
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        until curl -fsS http://toxiproxy:8474/version >/dev/null; do sleep 1; done
        # 409 means the proxy or toxic already exists: fine on a re-run.
        post() { curl -sS -o /dev/null -w '%{http_code}' -X POST "$$@" | grep -qE '^(2..|409)$'; }
        post http://toxiproxy:8474/proxies -d '{"name":"postgres","listen":"0.0.0.0:55435","upstream":"postgres:5432"}'
        for s in downstream upstream; do
          post http://toxiproxy:8474/proxies/postgres/toxics -d '{"name":"latency_'$$s'","type":"latency","stream":"'$$s'","attributes":{"latency":15}}'
        done

volumes:
  qh-postgres-data:
  qh-mysql-data:
